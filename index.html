<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة مدخرات الذهب</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 450px; }
        h2 { text-align: center; color: #d4af37; margin-top: 0; }
        .status { background: #fff8e7; border: 1px solid #ffe082; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 20px; color: #b78103; font-weight: bold; font-size: 14px; }
        .field { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 14px; color: #333; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; outline: none; }
        button { width: 100%; background: #d4af37; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #b89528; }
        .result { margin-top: 20px; padding: 15px; background: #e8f5e9; border: 1px solid #c8e6c9; border-radius: 6px; display: none; }
        .row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .total { font-weight: bold; color: #1b5e20; border-top: 1px solid #a5d6a7; padding-top: 8px; font-size: 16px; }
    </style>
</head>
<body>

<div class="card">
    <h2>حاسبة قيمة المدخرات</h2>
    <div class="status" id="status-box">جاري جلب سعر الذهب المباشر...</div>

    <p style="font-size: 13px; color: #666; margin-bottom: 15px;">أدخل أوزان الذهب التي تمتلكها بالجرام لكل عيار:</p>

    <div class="field">
        <label>وزن عيار 24 (سبائك / ذهب نقي):</label>
        <input type="number" id="w24" placeholder="0" min="0" step="any">
    </div>

    <div class="field">
        <label>وزن عيار 22:</label>
        <input type="number" id="w22" placeholder="0" min="0" step="any">
    </div>

    <div class="field">
        <label>وزن عيار 21:</label>
        <input type="number" id="w21" placeholder="0" min="0" step="any">
    </div>

    <div class="field">
        <label>وزن عيار 18:</label>
        <input type="number" id="w18" placeholder="0" min="0" step="any">
    </div>

    <button onclick="calculateSavings()">احسب قيمة المدخرات الكلية</button>

    <div class="result" id="result-box">
        <div class="row"><span>إجمالي الوزن الصافي (مكافئ 24):</span> <span id="pure-weight">0 جرام</span></div>
        <div class="row total"><span>القيمة المالية الكلية للمدخرات:</span> <span id="total-value">$0</span></div>
    </div>
</div>

<script>
    let gram24Price = 0;

    async function fetchPrice() {
        const statusBox = document.getElementById('status-box');
        try {
            const res = await fetch('/api/gold');
            const data = await res.json();

            if (data.success) {
                gram24Price = data.pricePerGram24;
                statusBox.innerText = `سعر جرام عيار 24 الحالي: $${gram24Price.toFixed(2)}`;
            } else {
                statusBox.innerText = 'عذرًا، تعذر جلب السعر المباشر حاليًا';
            }
        } catch (err) {
            statusBox.innerText = 'خطأ في الاتصال بالخادم';
        }
    }

    function calculateSavings() {
        const w24 = parseFloat(document.getElementById('w24').value) || 0;
        const w22 = parseFloat(document.getElementById('w22').value) || 0;
        const w21 = parseFloat(document.getElementById('w21').value) || 0;
        const w18 = parseFloat(document.getElementById('w18').value) || 0;

        if (w24 === 0 && w22 === 0 && w21 === 0 && w18 === 0) {
            alert('يرجى إدخال وزن في عيار واحد على الأقل');
            return;
        }

        if (gram24Price === 0) {
            alert('يرجى الانتظار حتى يتم جلب سعر الذهب المباشر');
            return;
        }

        // تحويل كافة الأوزان إلى ما يعادلها من الذهب الصافي (عيار 24)
        const pure24Equiv = w24 + (w22 * 22 / 24) + (w21 * 21 / 24) + (w18 * 18 / 24);
        const totalValueUSD = pure24Equiv * gram24Price;

        document.getElementById('pure-weight').innerText = `${pure24Equiv.toFixed(2)} جرام`;
        document.getElementById('total-value').innerText = `$${totalValueUSD.toFixed(2)}`;

        document.getElementById('result-box').style.display = 'block';
    }

    window.onload = fetchPrice;
</script>

</body>
</html>
