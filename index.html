<script>
    let goldPrice24 = 0;

    // جلب السعر فور تحميل الصفحة
    async function loadGoldPrice() {
        const statusEl = document.getElementById('status');
        try {
            const res = await fetch('/api/gold');
            const data = await res.json();
            
            if (data.success) {
                goldPrice24 = data.pricePerGram24;
                statusEl.innerText = `سعر جرام عيار 24 الحالي: $${goldPrice24.toFixed(2)}`;
            } else {
                statusEl.innerText = 'حدث خطأ في جلب السعر من الخادم';
            }
        } catch (err) {
            statusEl.innerText = 'فشل الاتصال بالخادم';
        }
    }

    function calculate() {
        const weight = parseFloat(document.getElementById('weight').value);
        const karat = parseInt(document.getElementById('karat').value);
        const making = parseFloat(document.getElementById('making').value) || 0;

        if (!weight || weight <= 0) {
            alert('يرجى إدخال وزن صحيح');
            return;
        }

        if (goldPrice24 === 0) {
            alert('لم يتم جلب السعر بعد، يرجى الانتظار');
            return;
        }

        const gramPrice = (goldPrice24 * karat) / 24;
        const totalGold = gramPrice * weight;
        const totalMaking = making * weight;
        const grandTotal = totalGold + totalMaking;

        document.getElementById('total').innerText = `$${grandTotal.toFixed(2)}`;
    }

    window.onload = loadGoldPrice;
</script>
