<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المدخرات والذهب</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #2c3e50;
            --accent-gold: #d4af37;
            --accent-green: #27ae60;
            --text-main: #333333;
            --text-muted: #7f8c8d;
            --border-color: #eef2f5;
        }

        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px 10px; }
        
        .container { background: var(--card-bg); width: 100%; max-width: 450px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 24px; }
        
        header { text-align: center; margin-bottom: 20px; }
        header h2 { font-size: 22px; color: var(--primary); font-weight: 700; }
        header p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

        .section-title { font-size: 14px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; margin: 16px 0 10px 0; display: flex; align-items: center; gap: 8px; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border-color); }

        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .input-group.full { grid-column: span 2; }
        
        label { font-size: 13px; font-weight: 500; color: #555; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #dcdfe6; border-radius: 8px; font-size: 14px; background: #fafafa; transition: all 0.2s ease; outline: none; }
        input:focus { border-color: var(--accent-gold); background: #fff; box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); }

        button { width: 100%; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
        button:hover { background: #1a252f; }

        .status { font-size: 12px; text-align: center; color: var(--text-muted); margin-top: 8px; min-height: 18px; }

        .results-card { background: #fdfdfd; border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-top: 16px; }
        .res-row { display: flex; justify-content: space-between; font-size: 13.5px; padding: 6px 0; border-bottom: 1px dashed var(--border-color); }
        .res-row:last-child { border-bottom: none; }
        .res-value { font-weight: 700; color: var(--primary); }
        .res-value.gold { color: #b78103; }

        .total-card { background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff; border-radius: 12px; padding: 16px; text-align: center; margin-top: 16px; box-shadow: 0 4px 12px rgba(39, 174, 96, 0.2); }
        .total-card span { display: block; font-size: 12px; opacity: 0.9; margin-bottom: 4px; }
        .total-card strong { font-size: 22px; font-weight: 700; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>حاسبة المدخرات والذهب</h2>
        <p>تحديث مباشر ومتابعة تلقائية لمحفظتك</p>
    </header>

    <div class="input-group full">
        <label for="usdRate">سعر صرف الدولار (SDG):</label>
        <input type="number" id="usdRate" placeholder="مثال: 2000">
    </div>

    <div class="section-title">الأصول والمدخرات</div>

    <div class="input-grid">
        <div class="input-group">
            <label for="g21Amount">ذهب عيار 21 (جرام):</label>
            <input type="number" id="g21Amount" placeholder="0">
        </div>

        <div class="input-group">
            <label for="g24Amount">ذهب 24 (995) (جرام):</label>
            <input type="number" id="g24Amount" placeholder="0">
        </div>

        <div class="input-group">
            <label for="usdSavings">كاش دولار ($):</label>
            <input type="number" id="usdSavings" placeholder="0">
        </div>

        <div class="input-group">
            <label for="sdgSavings">كاش جنيه (SDG):</label>
            <input type="number" id="sdgSavings" placeholder="0">
        </div>
    </div>

    <button onclick="calculateGoldPrices()">حساب وتحديث الإجمالي</button>
    <div id="status" class="status"></div>

    <div id="results" class="results-card" style="display: none;">
        <div class="res-row">
            <span>أونصة الذهب عالمياً:</span>
            <span id="ouncePriceUsd" class="res-value gold">-- USD</span>
        </div>
        <div class="res-row">
            <span>سعر جرام 24 (995):</span>
            <span id="g24" class="res-value">--</span>
        </div>
        <div class="res-row">
            <span>سعر جرام عيار 21:</span>
            <span id="g21" class="res-value">--</span>
        </div>

        <div class="section-title" style="margin-top: 12px;">تفاصيل المحفظة</div>

        <div class="res-row">
            <span>قيمة ذهب عيار 21:</span>
            <span id="valG21" class="res-value">0 SDG</span>
        </div>
        <div class="res-row">
            <span>قيمة ذهب عيار 24 (995):</span>
            <span id="valG24" class="res-value">0 SDG</span>
        </div>
        <div class="res-row">
            <span>قيمة الدولار الكاش:</span>
            <span id="valUsd" class="res-value">0 SDG</span>
        </div>
        <div class="res-row">
            <span>النقد بالجنيه السوداني:</span>
            <span id="valSdg" class="res-value">0 SDG</span>
        </div>

        <div class="total-card">
            <span>إجمالي صافي المدخرات</span>
            <strong id="totalSavings">0 SDG</strong>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
