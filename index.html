<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة أسعار الذهب</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 420px; }
        h2 { text-align: center; color: #d4af37; margin-top: 0; }
        .status { background: #fff8e7; border: 1px solid #ffe082; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 15px; color: #b78103; font-weight: bold; font-size: 14px; }
        .field { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 14px; color: #333; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; outline: none; }
        button { width: 100%; background: #d4af37; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #b89528; }
        .result { margin-top: 15px; padding: 12px; background: #e8f5e9; border: 1px solid #c8e6c9; border-radius: 6px; display: none; }
        .row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; }
        .total { font-weight: bold; color: #1b5e20; border-top: 1px solid #a5d6a7; padding-top: 6px; margin-top: 6px; }
    </style>
</head>
<body>

<div class="card">
    <h2>حاسبة أسعار الذهب</h2>
    <div class="status" id="status-box">جاري جلب السعر من الخادم...</div>

    <div class="field">
        <label>الوزن (جرام):</label>
        <input type="number" id="weight" placeholder="أدخل الوزن" min="0.1" step="any">
    </div>

    <div class="field">
        <label>العيار:</label>
        <select id="karat">
            <option value="24">24</option>
            <option value="22">22</option>
            <option value="21" selected>21</option>
            <option value="18">18</option>
        </select>
    </div>

    <div class="field">
        <label>المصنعية للجرام ($):</label>
        <input type="number" id="making" value="0" min="0" step="any">
    </div>

    <button onclick="calculate()">احسب الإجمالي</button>

    <div class="result" id="result-box">
        <div class="row"><span>سعر جرام عيار 24:</span> <span id="gram-24">$0</span></div>
        <div class="row"><span>إجمالي الذهب:</span> <span id="gold-total">$0</span></div>
        <div class="row"><span>إجمالي المصنعية:</span> <span id="making-total">$0</span></div>
        <div class="row total"><span>الإجمالي الكلي:</span> <span id="grand-total">$0</span></div>
    </div>
</div>

<script>
    let rawPrice = 0;
    let gram24Price = 0;

    async function fetchPrice() {
        const statusBox = document.getElementById('status-box');
        try {
            const res = await fetch('/api/gold');
            const data = await res.json();

            if (data.success) {
                rawPrice = data.price;
                // التحقق مما إذا كانت القيمة المحصلة أونصة أم جرام
                gram24Price = rawPrice > 1000 ? (rawPrice / 31.1034768) : rawPrice;
                statusBox.innerText = `سعر جرام 24 الحالي: $${gram24Price.toFixed(2)}`;
            } else {
                statusBox.innerText = 'فشل جلب السعر من السيرفر';
            }
        } catch (err) {
            statusBox.innerText = 'خطأ في الاتصال بالخادم';
        }
    }

    function calculate() {
        const weight = parseFloat(document.getElementById('weight').value);
        const karat = parseInt(document.getElementById('karat').value);
        const making = parseFloat(document.getElementById('making').value) || 0;

        if (!weight || weight <= 0) {
            alert('يرجى إدخال وزن صحيح');
            return;
        }

        if (gram24Price === 0) {
            alert('انتظر جلب سعر الذهب أولاً');
            return;
        }

        const currentGramPrice = (gram24Price * karat) / 24;
        const totalGold = currentGramPrice * weight;
        const totalMaking = making * weight;
        const grandTotal = totalGold + totalMaking;

        document.getElementById('gram-24').innerText = `$${currentGramPrice.toFixed(2)}`;
        document.getElementById('gold-total').innerText = `$${totalGold.toFixed(2)}`;
        document.getElementById('making-total').innerText = `$${totalMaking.toFixed(2)}`;
        document.getElementById('grand-total').innerText = `$${grandTotal.toFixed(2)}`;

        document.getElementById('result-box').style.display = 'block';
    }

    window.onload = fetchPrice;
</script>

</body>
</html>
